<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Calendar</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', -apple-system, sans-serif; margin: 0; padding: 12px; background: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: auto; }
        .nav-bar { display: flex; justify-content: center; background: #2c3e50; padding: 8px; margin-bottom: 14px; border-radius: 8px; gap: 4px; }
        .nav-bar a { color: white; text-decoration: none; font-weight: bold; font-size: 0.85em; padding: 6px 10px; border-radius: 4px; }
        .nav-bar a.active { background: #3498db; }
        button { font-family: inherit; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; }

        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
        .cal-header h3 { margin: 0; font-size: 1.05em; text-align: center; }
        .btn-nav { background: #34495e; color: white; padding: 9px 14px; font-size: 14px; }
        .jump { display: block; text-align: center; font-size: 0.85em; color: #3498db; margin: 0 0 12px; }

        .day { display: flex; gap: 10px; background: white; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .day.today { border: 2px solid #f1c40f; background: #fffdf0; }
        .day.past { opacity: .6; }
        .date { width: 46px; flex: none; text-align: center; color: #7f8c8d; padding-top: 2px; }
        .date .dow { font-size: 0.75em; text-transform: uppercase; font-weight: 700; letter-spacing: .04em; }
        .date .num { font-size: 1.35em; font-weight: 700; color: #2c3e50; line-height: 1.1; }
        .date .mon { font-size: 0.7em; }
        .meals { flex: 1; min-width: 0; }
        .meal + .meal { border-top: 1px solid #eef0f0; margin-top: 8px; padding-top: 8px; }
        .meal-top { display: flex; align-items: baseline; gap: 6px; }
        .meal-name { font-weight: 600; color: #2c3e50; text-decoration: none; flex: 1; min-width: 0; font-size: 1.02em; }
        .meal-links { display: flex; gap: 2px; flex: none; }
        .meal-links a { text-decoration: none; font-size: 1.1em; padding: 2px 4px; }
        .sides { font-size: 0.82em; color: #7f8c8d; margin-top: 2px; }
        .meal-actions { display: flex; gap: 6px; margin-top: 7px; }
        .act-btn { padding: 6px 10px; font-size: 0.78em; background: #ecf0f1; color: #2c3e50; }
        .act-btn.del { color: #c0392b; }
        .plan-link { display: inline-block; color: #3498db; text-decoration: none; font-size: 0.9em; padding: 4px 0; }
        .add-another { font-size: 0.8em; margin-top: 6px; }
        .shop-link { display: block; text-align: center; background: #27ae60; color: white; text-decoration: none; font-weight: bold; padding: 13px; border-radius: 10px; margin-top: 14px; }
        #moveDate { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

        #swap-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
        .swap-modal { background: white; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); border-radius: 16px 16px 0 0; width: 100%; max-width: 600px; }
        .swap-modal h3 { margin: 0 0 4px; }
        .swap-modal label { display: block; margin-top: 12px; font-size: 0.85em; color: #7f8c8d; font-weight: 600; }
        .swap-modal select { width: 100%; padding: 11px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        .swap-actions { display: flex; gap: 8px; margin-top: 18px; }
        .swap-actions button { flex: 1; padding: 13px; font-size: 15px; }

        @media print {
            .nav-bar, .btn-nav, .jump, .meal-actions, .meal-links, .plan-link, .shop-link, #swap-overlay { display: none !important; }
            .day { box-shadow: none; border: 1px solid #000; break-inside: avoid; opacity: 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <nav class="nav-bar">
        <a href="recipes.html">Recipes</a>
        <a href="planner.html">Plan</a>
        <a href="view.html" class="active">Calendar</a>
        <a href="shop.html">Shop</a>
    </nav>

    <div class="cal-header">
        <button class="btn-nav" onclick="changeWeek(-7)">← Prev</button>
        <h3 id="cal-title">Syncing...</h3>
        <button class="btn-nav" onclick="changeWeek(7)">Next →</button>
    </div>
    <a href="#" class="jump" onclick="resetToToday(); return false;">Jump to today</a>

    <div id="days"></div>
    <a class="shop-link" href="shop.html">🛒 Shopping list</a>
</div>

<input type="date" id="moveDate">

<div id="swap-overlay" onclick="if (event.target === this) closeSwap()">
    <div class="swap-modal">
        <h3>Swap a side</h3>
        <div id="swap-meal-name" style="color:#3498db; font-weight:600;"></div>
        <label>Replace</label>
        <select id="swap-out-picker"></select>
        <label>With</label>
        <select id="all-sides-picker"></select>
        <div class="swap-actions">
            <button onclick="closeSwap()" style="background:#ecf0f1; color:#2c3e50;">Cancel</button>
            <button onclick="confirmSwap()" style="background:#27ae60; color:white;">Swap</button>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script>
    const DAYS_SHOWN = 14;
    let mealsDb = [], calendarDb = [];
    let currentStartDate = startOfToday();
    let activeSwapIndex = null;

    function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }

    async function init() {
        if (!getToken()) return;
        try {
            const [meals, cal] = await Promise.all([readJson('food/meals.json'), readJson('food/calendar.json')]);
            mealsDb = meals.data;
            calendarDb = cal.data;
            render();
        } catch (e) {
            document.getElementById('cal-title').innerText = "Sync Failed";
        }
    }

    function findMeal(name) {
        return mealsDb.find(db => db.name.trim() === name.trim());
    }

    function render() {
        const todayStr = startOfToday().toLocaleDateString('en-CA');
        let html = '';
        for (let i = 0; i < DAYS_SHOWN; i++) {
            const d = new Date(currentStartDate);
            d.setDate(currentStartDate.getDate() + i);
            const dateStr = d.toLocaleDateString('en-CA');
            const dayMeals = calendarDb.map((m, idx) => ({ m, idx })).filter(x => x.m.date === dateStr);
            const cls = dateStr === todayStr ? 'today' : dateStr < todayStr ? 'past' : '';
            html += `<div class="day ${cls}">
                <div class="date">
                    <div class="dow">${d.toLocaleDateString(undefined, { weekday: 'short' })}</div>
                    <div class="num">${d.getDate()}</div>
                    <div class="mon">${d.toLocaleDateString(undefined, { month: 'short' })}</div>
                </div>
                <div class="meals">
                    ${dayMeals.map(({ m, idx }) => mealHtml(m, idx)).join('')}
                    <a class="plan-link ${dayMeals.length ? 'add-another' : ''}" href="planner.html?date=${dateStr}">${dayMeals.length ? '+ Add another' : '+ Plan a meal'}</a>
                </div>
            </div>`;
        }
        document.getElementById('days').innerHTML = html;

        const end = new Date(currentStartDate);
        end.setDate(currentStartDate.getDate() + DAYS_SHOWN - 1);
        const fmt = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        document.getElementById('cal-title').innerText = `${fmt(currentStartDate)} – ${fmt(end)}`;
    }

    function mealHtml(m, idx) {
        const meal = findMeal(m.meal);
        const editUrl = meal ? `recipes.html?edit=${encodeURIComponent(meal.name)}` : '';
        const main = meal && (meal.video || meal.link);
        const sides = m.sides_included.filter(s => s !== 'Main Dish');
        const nameTag = main
            ? `<a class="meal-name" href="${escapeHtml(main)}" target="_blank">${escapeHtml(m.meal)}</a>`
            : editUrl ? `<a class="meal-name" href="${escapeHtml(editUrl)}">${escapeHtml(m.meal)}</a>`
            : `<span class="meal-name">${escapeHtml(m.meal)}</span>`;
        return `<div class="meal">
            <div class="meal-top">
                ${nameTag}
                <span class="meal-links">
                    ${meal && meal.video ? `<a href="${escapeHtml(meal.video)}" target="_blank" title="Video">🎬</a>` : ''}
                    ${meal && meal.link ? `<a href="${escapeHtml(meal.link)}" target="_blank" title="Recipe">📄</a>` : ''}
                    ${editUrl ? `<a href="${escapeHtml(editUrl)}" title="Edit recipe">✏️</a>` : ''}
                </span>
            </div>
            ${sides.length ? `<div class="sides">with ${escapeHtml(sides.join(', '))}</div>` : ''}
            <div class="meal-actions">
                <button class="act-btn" onclick="openSwap(${idx})">Swap side</button>
                <button class="act-btn" onclick="moveMeal(${idx})">Move</button>
                <button class="act-btn del" onclick="deleteMeal(${idx})">Remove</button>
            </div>
        </div>`;
    }

    // Applies `change(entry)` to the latest saved copy of the entry (`change` returns false to delete it).
    async function updateEntry(index, change, message) {
        const target = calendarDb[index];
        const same = e => e.date === target.date && e.meal === target.meal
            && JSON.stringify(e.sides_included) === JSON.stringify(target.sides_included);
        document.getElementById('cal-title').innerText = 'Saving...';
        try {
            calendarDb = await updateJson('food/calendar.json', cal => {
                const i = cal.findIndex(same);
                if (i < 0) throw new Error('That meal was already changed somewhere else.');
                if (change(cal[i]) === false) cal.splice(i, 1);
                return cal;
            }, message);
            render();
        } catch (e) {
            alert("GitHub Save Failed. " + e.message);
            location.reload();
        }
    }

    // --- Action Functions ---
    function deleteMeal(index) {
        if (confirm(`Remove ${calendarDb[index].meal} from ${calendarDb[index].date}?`)) updateEntry(index, () => false, "Calendar Update");
    }

    function moveMeal(index) {
        const picker = document.getElementById('moveDate');
        picker.value = calendarDb[index].date;
        picker.onchange = () => {
            const newDate = picker.value;
            if (newDate && newDate !== calendarDb[index].date) updateEntry(index, e => { e.date = newDate; }, "Calendar Update");
        };
        try {
            picker.showPicker();
        } catch (e) {
            // Older browsers without showPicker() fall back to typing the date.
            const typed = prompt("Enter new date (YYYY-MM-DD):", calendarDb[index].date);
            if (!typed) return;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(typed.trim())) return alert("Use the format YYYY-MM-DD.");
            picker.value = typed.trim();
            picker.onchange();
        }
    }

    function allSideNames() {
        const sides = new Set();
        mealsDb.forEach(m => m.components.forEach(c => { if (c.type === 'side') sides.add(c.name); }));
        return [...sides].sort((a, b) => a.localeCompare(b));
    }

    function openSwap(index) {
        activeSwapIndex = index;
        const entry = calendarDb[index];
        document.getElementById('swap-meal-name').innerText = entry.meal;
        const current = entry.sides_included.filter(s => s !== "Main Dish");
        document.getElementById('swap-out-picker').innerHTML =
            current.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')
            + '<option value="">(nothing, just add a side)</option>';
        document.getElementById('all-sides-picker').innerHTML =
            allSideNames().map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
        document.getElementById('swap-overlay').style.display = 'flex';
    }

    async function confirmSwap() {
        const out = document.getElementById('swap-out-picker').value;
        const newSide = document.getElementById('all-sides-picker').value;
        closeSwap();
        await updateEntry(activeSwapIndex, e => {
            const sides = e.sides_included.filter(s => s !== out && s !== newSide);
            sides.push(newSide);
            e.sides_included = sides;
        }, "Calendar Update");
    }

    function closeSwap() { document.getElementById('swap-overlay').style.display = 'none'; }
    function changeWeek(days) { currentStartDate.setDate(currentStartDate.getDate() + days); render(); }
    function resetToToday() { currentStartDate = startOfToday(); render(); }

    init();
</script>
</body>
</html>
