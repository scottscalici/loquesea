<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background: #f4f7f6; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .nav-bar { display: flex; justify-content: center; background: #2c3e50; padding: 10px; margin-bottom: 20px; border-radius: 8px; gap: 4px; }
        .nav-bar a { color: white; text-decoration: none; font-weight: bold; font-size: 0.85em; padding: 5px 10px; border-radius: 4px; }
        .nav-bar a.active { background: #3498db; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.9em; color: #7f8c8d; }
        select, input[type="date"], input[type="text"] { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        .components-box { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 10px; border: 1px solid #eee; }
        button { width: 100%; background: #3498db; color: white; border: none; padding: 14px; margin-top: 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
        .side-row { display: flex; align-items: center; margin-bottom: 10px; background: white; padding: 8px; border-radius: 6px; border: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
        <a href="recipes.html">Recipes</a>
        <a href="planner.html" class="active">Plan</a>
        <a href="view.html">Calendar</a>
        <a href="shop.html">Shop</a>
        </nav>

        <h2>Plan a Meal</h2>

        <label>1. Select Date</label>
        <input type="date" id="planDate">

        <label>2. Search & Filter</label>
        <input type="text" id="searchInput" placeholder="Search dish..." onkeyup="filterMeals()">
        <select id="tagFilter" onchange="filterMeals()" style="margin-top:10px;">
            <option value="all">All Categories</option>
        </select>

        <label>3. Select Result</label>
        <select id="mealSelect" onchange="loadComponents()">
            <option value="">-- Choose Meal --</option>
        </select>
        <a href="recipes.html?new" style="display:block; margin-top:8px; font-size:0.85em; color:#3498db;">Not listed? Add a new recipe →</a>

        <div id="componentsArea" class="components-box" style="display:none;">
            <label style="margin-top:0;">4. Confirm Sides</label>
            <div id="componentList"></div>
            
            <label style="margin-top:15px; color:#3498db;">+ Add/Swap a Different Side</label>
            <select id="globalSidePicker" onchange="addGlobalSide()">
                <option value="">-- Select from all sides --</option>
            </select>
        </div>

        <button onclick="saveToCalendar()">Save to GitHub</button>
        <div id="status"></div>
    </div>

    <script src="common.js"></script>
    <script>
        let allMeals = [];

        async function init() {
            if (!getToken()) return;
            try {
                allMeals = (await readJson('food/meals.json')).data;
            } catch (e) {
                document.getElementById('status').innerHTML = `<span style="color:red">${escapeHtml(e.message)}</span>`;
                return;
            }
            
            const params = new URLSearchParams(location.search);
            if (params.get('date')) document.getElementById('planDate').value = params.get('date');
            populateTags();
            populateGlobalSides();
            filterMeals(); 
        }

        function populateTags() {
            const tagSelect = document.getElementById('tagFilter');
            const tags = new Set();
            allMeals.forEach(m => m.tags.forEach(t => tags.add(t.toLowerCase())));
            [...tags].sort().forEach(tag => {
                const opt = document.createElement('option');
                opt.value = tag;
                opt.textContent = tag.charAt(0).toUpperCase() + tag.slice(1);
                tagSelect.appendChild(opt);
            });
        }

        function populateGlobalSides() {
            const picker = document.getElementById('globalSidePicker');
            const sides = new Set();
            allMeals.forEach(m => m.components.forEach(c => {
                if(c.type === 'side') sides.add(c.name);
            }));
            [...sides].sort().forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                picker.appendChild(opt);
            });
        }

        function filterMeals() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedTag = document.getElementById('tagFilter').value;
            const mealSelect = document.getElementById('mealSelect');
            mealSelect.innerHTML = '<option value="">-- Choose Meal --</option>';

            const filtered = allMeals.filter(m => {
                const matchesTag = selectedTag === 'all' || m.tags.some(t => t.toLowerCase() === selectedTag);
                const matchesSearch = m.name.toLowerCase().includes(searchTerm);
                return matchesTag && matchesSearch;
            });

            filtered.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.name;
                opt.textContent = m.name;
                mealSelect.appendChild(opt);
            });
        }

        function loadComponents() {
            const mealName = document.getElementById('mealSelect').value;
            const meal = allMeals.find(m => m.name === mealName);
            const list = document.getElementById('componentList');
            document.getElementById('componentsArea').style.display = meal ? 'block' : 'none';
            
            if (!meal) return;
            // Filter out "Main Dish" from being uncheckable, but keep it in the list
            list.innerHTML = meal.components.map((c, i) => `
                <div class="side-row">
                    <input type="checkbox" class="comp-cb" id="c-${i}" value="${escapeHtml(c.name)}" ${c.type === 'main' ? 'checked disabled' : 'checked'}>
                    <label for="c-${i}" style="margin-left:10px; font-weight:normal; margin-top:0;">${escapeHtml(c.name)} ${c.type === 'main' ? '(Main)' : ''}</label>
                </div>`).join('');
        }

        function addGlobalSide() {
            const picker = document.getElementById('globalSidePicker');
            const sideName = picker.value;
            if (!sideName) return;

            const list = document.getElementById('componentList');
            const id = Date.now();
            const newSideHtml = `
                <div class="side-row" style="border-color: #3498db;">
                    <input type="checkbox" class="comp-cb" id="new-${id}" value="${escapeHtml(sideName)}" checked>
                    <label for="new-${id}" style="margin-left:10px; font-weight:normal; margin-top:0;">${escapeHtml(sideName)} <small>(Added)</small></label>
                </div>`;
            list.insertAdjacentHTML('beforeend', newSideHtml);
            picker.value = ""; // Reset picker
        }

        async function saveToCalendar() {
            const statusDiv = document.getElementById('status');
            const date = document.getElementById('planDate').value;
            const mealName = document.getElementById('mealSelect').value;
            if (!date || !mealName) return alert("Select date and meal.");

            statusDiv.innerHTML = "Saving...";
            const selected = Array.from(document.querySelectorAll('.comp-cb:checked')).map(cb => cb.value);

            try {
                await updateJson('food/calendar.json', cal => {
                    cal.push({ date, meal: mealName, sides_included: selected });
                    return cal;
                }, `Plan ${date}`);
                statusDiv.innerHTML = '<span style="color:green">Success! Meal Added.</span>';
                // Coming from the calendar's "+ Plan a meal", go back to it.
                setTimeout(() => new URLSearchParams(location.search).has('date') ? location.href = 'view.html' : location.reload(), 1200);
            } catch (err) {
                statusDiv.innerHTML = `<span style="color:red">Error saving: ${escapeHtml(err.message)}</span>`;
            }
        }
        init();
    </script>
</body>
</html>
